<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaveReel — Video Songs</title>
<style>
  :root{
    --bg: #0D0B1A;
    --bg-soft: #15122A;
    --card: #1B1830;
    --accent: #FF3CAC;
    --accent2: #00E5FF;
    --text: #F5F3FA;
    --muted: #9B95B8;
    --font-display: 'Space Grotesk', 'Poppins', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html{ scroll-behavior: smooth; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height:100vh;
    overflow-x:hidden;
  }

  /* ---------- Waveform background decoration ---------- */
  .wave-bg{
    position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,60,172,0.12), transparent 45%),
      radial-gradient(circle at 85% 75%, rgba(0,229,255,0.10), transparent 50%);
  }

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 5%;
    background: rgba(13,11,26,0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .logo{
    font-family: var(--font-display);
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    display:flex; align-items:center; gap:10px;
  }
  .logo span{
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .logo-bars{ display:flex; align-items:flex-end; gap:3px; height:22px; }
  .logo-bars i{
    display:block; width:4px; border-radius:2px;
    background: linear-gradient(180deg, var(--accent2), var(--accent));
    animation: bounce 1.2s ease-in-out infinite;
  }
  .logo-bars i:nth-child(1){ height:10px; animation-delay:0s; }
  .logo-bars i:nth-child(2){ height:20px; animation-delay:0.2s; }
  .logo-bars i:nth-child(3){ height:14px; animation-delay:0.4s; }
  .logo-bars i:nth-child(4){ height:22px; animation-delay:0.1s; }
  @keyframes bounce{
    0%,100%{ transform: scaleY(0.4); }
    50%{ transform: scaleY(1); }
  }

  .search-box{
    flex:1; max-width:420px; margin: 0 24px;
    position:relative;
  }
  .search-box input{
    width:100%;
    padding: 10px 16px 10px 40px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.1);
    background: var(--bg-soft);
    color: var(--text);
    font-size: 0.9rem;
    outline:none;
    transition: border 0.2s;
  }
  .search-box input:focus{ border-color: var(--accent2); }
  .search-box svg{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; opacity:0.6;
  }

  nav ul{ list-style:none; display:flex; gap: 26px; }
  nav a{
    color: var(--muted); text-decoration:none; font-size:0.92rem;
    font-weight:500; transition: color 0.2s;
  }
  nav a:hover, nav a.active{ color: var(--text); }

  @media (max-width: 820px){
    .search-box{ display:none; }
    nav ul{ gap:14px; font-size:0.8rem; }
  }

  /* ---------- Hero / Now Playing ---------- */
  .hero{
    padding: 40px 5% 10px;
    display:grid;
    grid-template-columns: 1.3fr 0.9fr;
    gap: 30px;
    align-items:stretch;
  }
  @media (max-width: 900px){
    .hero{ grid-template-columns: 1fr; }
  }

  .player-wrap{
    background: var(--card);
    border-radius: 18px;
    overflow:hidden;
    border: 1px solid rgba(255,255,255,0.06);
    position:relative;
  }
  .player-wrap video{
    width:100%; display:block; aspect-ratio: 16/9; background:#000;
  }
  .now-info{
    padding: 18px 22px 22px;
  }
  .eyebrow{
    font-size: 0.72rem; letter-spacing: 2px; text-transform:uppercase;
    color: var(--accent2); font-weight:600; margin-bottom:6px;
  }
  .now-title{
    font-family: var(--font-display);
    font-size: 1.6rem; font-weight:700; margin-bottom:4px;
  }
  .now-artist{ color: var(--muted); font-size:0.95rem; }
  .now-meta{
    display:flex; gap:16px; margin-top:14px; flex-wrap:wrap;
  }
  .pill{
    font-size:0.75rem; padding: 5px 12px; border-radius: 999px;
    background: rgba(255,255,255,0.05); color: var(--muted);
    border: 1px solid rgba(255,255,255,0.08);
  }

  /* Waveform scrub visual under player */
  .waveform{
    display:flex; align-items:center; gap:2px; height: 34px;
    margin-top: 16px; cursor:pointer;
  }
  .waveform i{
    flex:1; background: rgba(255,255,255,0.15); border-radius:2px;
    min-width:2px;
  }
  .waveform i.played{ background: linear-gradient(180deg, var(--accent2), var(--accent)); }

  /* Up Next panel */
  .upnext{
    background: var(--card);
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.06);
    padding: 18px;
    display:flex; flex-direction:column;
  }
  .upnext h3{
    font-family: var(--font-display); font-size:1.05rem; margin-bottom:14px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .upnext h3 span{ color: var(--muted); font-size:0.75rem; font-weight:400; }
  .queue-list{ list-style:none; display:flex; flex-direction:column; gap:8px; overflow-y:auto; max-height: 360px; }
  .queue-item{
    display:flex; align-items:center; gap:12px;
    padding: 8px; border-radius: 10px; cursor:pointer;
    transition: background 0.15s;
  }
  .queue-item:hover, .queue-item.playing{ background: rgba(255,255,255,0.05); }
  .queue-thumb{
    width:52px; height:36px; border-radius:6px; flex-shrink:0;
    background-size:cover; background-position:center;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .queue-item.playing .queue-thumb::after{
    content:"▶"; font-size:0.6rem; color:#fff;
    background: rgba(0,0,0,0.4); width:100%; height:100%;
    display:flex; align-items:center; justify-content:center; border-radius:6px;
  }
  .queue-text{ flex:1; min-width:0; }
  .queue-text .qt{ font-size:0.85rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .queue-text .qa{ font-size:0.75rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .queue-dur{ font-size:0.72rem; color:var(--muted); flex-shrink:0; }

  /* ---------- Genre chips ---------- */
  .chips{
    display:flex; gap:10px; padding: 22px 5% 4px; overflow-x:auto;
  }
  .chip{
    flex-shrink:0; padding: 8px 18px; border-radius:999px; font-size:0.85rem;
    background: var(--bg-soft); color: var(--muted); cursor:pointer;
    border:1px solid rgba(255,255,255,0.07); transition: all 0.2s;
    white-space:nowrap;
  }
  .chip:hover{ color:var(--text); }
  .chip.active{
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color:#0D0B1A; font-weight:700; border-color:transparent;
  }

  /* ---------- Grid ---------- */
  .section-title{
    font-family: var(--font-display); font-size:1.3rem; padding: 26px 5% 12px;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
    padding: 0 5% 40px;
  }
  .card{
    background: var(--card);
    border-radius: 14px;
    overflow:hidden;
    cursor:pointer;
    border:1px solid rgba(255,255,255,0.05);
    transition: transform 0.2s, border-color 0.2s;
  }
  .card:hover{ transform: translateY(-4px); border-color: rgba(255,60,172,0.4); }
  .thumb{
    aspect-ratio: 16/9;
    position:relative;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .thumb .playbtn{
    width:42px; height:42px; border-radius:50%;
    background: rgba(255,255,255,0.15); backdrop-filter: blur(4px);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:1rem; opacity:0; transition: opacity 0.2s;
  }
  .card:hover .thumb .playbtn{ opacity:1; }
  .thumb .dur{
    position:absolute; bottom:6px; right:8px; font-size:0.7rem;
    background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius:4px;
  }
  .card-info{ padding: 12px 14px 16px; }
  .card-info .ct{ font-size:0.92rem; font-weight:600; margin-bottom:2px; }
  .card-info .ca{ font-size:0.78rem; color:var(--muted); }

  /* ---------- Footer ---------- */
  footer{
    padding: 30px 5% 60px;
    text-align:center;
    color: var(--muted);
    font-size:0.8rem;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.15); border-radius:4px; }

  :focus-visible{ outline: 2px solid var(--accent2); outline-offset:2px; }

  @media (prefers-reduced-motion: reduce){
    .logo-bars i{ animation:none; }
  }
</style>
</head>
<body>

<div class="wave-bg"></div>

<header>
  <div class="logo">
    <div class="logo-bars"><i></i><i></i><i></i><i></i></div>
    Wave<span>Reel</span>
  </div>
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="Song ya artist khojein...">
  </div>
  <nav>
    <ul>
      <li><a href="#" class="active">Home</a></li>
      <li><a href="#">Trending</a></li>
      <li><a href="#">Playlists</a></li>
    </ul>
  </nav>
</header>

<section class="hero">
  <div class="player-wrap">
    <video id="mainVideo" controls poster="">
      <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
      Aapka browser video tag support nahi karta.
    </video>
    <div class="now-info">
      <div class="eyebrow">Ab chal raha hai</div>
      <div class="now-title" id="nowTitle">Neon Nights</div>
      <div class="now-artist" id="nowArtist">Arjun Verma</div>
      <div class="waveform" id="waveform"></div>
      <div class="now-meta">
        <span class="pill" id="nowGenre">Pop</span>
        <span class="pill" id="nowYear">2025</span>
        <span class="pill" id="nowDur">3:24</span>
      </div>
    </div>
  </div>

  <div class="upnext">
    <h3>Aage kya <span id="queueCount">10 gaane</span></h3>
    <ul class="queue-list" id="queueList"></ul>
  </div>
</section>

<div class="chips" id="chips"></div>

<h2 class="section-title">Sabhi Video Songs</h2>
<div class="grid" id="grid"></div>

<footer>
  WaveReel — Demo video song website. Saare titles aur artists kaalpanik (fictional) hain.
</footer>

<script>
/* ---------------- Sample data (fictional songs, demo video source) ---------------- */
const DEMO_SRC = "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4";

const songs = [
  { id:1,  title:"Neon Nights",        artist:"Arjun Verma",    genre:"Pop",      year:2025, dur:"3:24", color1:"#FF3CAC", color2:"#784BA0" },
  { id:2,  title:"Baarish Ke Baad",    artist:"Meera Kapoor",   genre:"Romantic", year:2024, dur:"4:02", color1:"#00E5FF", color2:"#2B5876" },
  { id:3,  title:"Dhadkan",           artist:"Rohit Bhatia",   genre:"Rock",     year:2023, dur:"3:47", color1:"#FF6A88", color2:"#FF9A8B" },
  { id:4,  title:"Sapno Ki Raahein",  artist:"Simran Kaur",    genre:"Folk",     year:2022, dur:"5:10", color1:"#F7971E", color2:"#FFD200" },
  { id:5,  title:"Electric Feel",     artist:"DJ Kabir",       genre:"EDM",      year:2025, dur:"3:02", color1:"#7F00FF", color2:"#E100FF" },
  { id:6,  title:"Chaand Se Aage",    artist:"Ananya Rao",     genre:"Pop",      year:2021, dur:"4:15", color1:"#00C9FF", color2:"#92FE9D" },
  { id:7,  title:"Toota Sa Dil",      artist:"Vikram Sen",     genre:"Romantic", year:2023, dur:"3:58", color1:"#F953C6", color2:"#B91D73" },
  { id:8,  title:"Rock The Highway",  artist:"Steel Wolves",   genre:"Rock",     year:2020, dur:"4:33", color1:"#414345", color2:"#232526" },
  { id:9,  title:"Gaon Ki Gali",      artist:"Ramesh Yadav",   genre:"Folk",     year:2019, dur:"5:40", color1:"#C79081", color2:"#DFA579" },
  { id:10, title:"Bass Drop Bhangra", artist:"DJ Kabir",       genre:"EDM",      year:2024, dur:"3:12", color1:"#FC5C7D", color2:"#6A82FB" },
];

const genres = ["Sabhi", ...new Set(songs.map(s=>s.genre))];
let activeGenre = "Sabhi";
let currentId = songs[0].id;

/* ---------------- Render: genre chips ---------------- */
const chipsEl = document.getElementById("chips");
function renderChips(){
  chipsEl.innerHTML = "";
  genres.forEach(g=>{
    const c = document.createElement("div");
    c.className = "chip" + (g===activeGenre ? " active":"");
    c.textContent = g;
    c.onclick = ()=>{ activeGenre = g; renderChips(); renderGrid(); };
    chipsEl.appendChild(c);
  });
}

/* ---------------- Render: main grid ---------------- */
const gridEl = document.getElementById("grid");
function thumbStyle(s){
  return `background:linear-gradient(135deg, ${s.color1}, ${s.color2});`;
}
function renderGrid(){
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const list = songs.filter(s=>{
    const matchGenre = activeGenre === "Sabhi" || s.genre === activeGenre;
    const matchSearch = !q || s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q);
    return matchGenre && matchSearch;
  });
  gridEl.innerHTML = "";
  if(list.length === 0){
    gridEl.innerHTML = `<div style="color:var(--muted); padding:20px;">Koi gaana nahi mila.</div>`;
    return;
  }
  list.forEach(s=>{
    const card = document.createElement("div");
    card.className = "card";
    card.onclick = ()=> playSong(s.id);
    card.innerHTML = `
      <div class="thumb" style="${thumbStyle(s)}">
        <div class="playbtn">▶</div>
        <div class="dur">${s.dur}</div>
      </div>
      <div class="card-info">
        <div class="ct">${s.title}</div>
        <div class="ca">${s.artist} · ${s.genre}</div>
      </div>`;
    gridEl.appendChild(card);
  });
}

/* ---------------- Render: up next queue ---------------- */
const queueEl = document.getElementById("queueList");
document.getElementById("queueCount").textContent = songs.length + " gaane";
function renderQueue(){
  queueEl.innerHTML = "";
  songs.forEach(s=>{
    const li = document.createElement("li");
    li.className = "queue-item" + (s.id === currentId ? " playing":"");
    li.onclick = ()=> playSong(s.id);
    li.innerHTML = `
      <div class="queue-thumb" style="${thumbStyle(s)}"></div>
      <div class="queue-text">
        <div class="qt">${s.title}</div>
        <div class="qa">${s.artist}</div>
      </div>
      <div class="queue-dur">${s.dur}</div>`;
    queueEl.appendChild(li);
  });
}

/* ---------------- Waveform bars ---------------- */
const waveformEl = document.getElementById("waveform");
function renderWaveform(){
  waveformEl.innerHTML = "";
  const bars = 60;
  for(let i=0;i<bars;i++){
    const bar = document.createElement("i");
    const h = 6 + Math.round(Math.random()*26);
    bar.style.height = h + "px";
    waveformEl.appendChild(bar);
  }
}
waveformEl.addEventListener("click", (e)=>{
  const rect = waveformEl.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  const video = document.getElementById("mainVideo");
  if(video.duration) video.currentTime = pct * video.duration;
});

const video = document.getElementById("mainVideo");
video.addEventListener("timeupdate", ()=>{
  if(!video.duration) return;
  const pct = video.currentTime / video.duration;
  const bars = waveformEl.children;
  const activeCount = Math.floor(pct * bars.length);
  for(let i=0;i<bars.length;i++){
    bars[i].classList.toggle("played", i < activeCount);
  }
});

/* ---------------- Play a song ---------------- */
function playSong(id){
  const s = songs.find(x=>x.id===id);
  if(!s) return;
  currentId = id;
  document.getElementById("nowTitle").textContent = s.title;
  document.getElementById("nowArtist").textContent = s.artist;
  document.getElementById("nowGenre").textContent = s.genre;
  document.getElementById("nowYear").textContent = s.year;
  document.getElementById("nowDur").textContent = s.dur;
  video.src = DEMO_SRC; // demo placeholder video source for every song
  video.play().catch(()=>{});
  renderWaveform();
  renderQueue();
  renderGrid();
  window.scrollTo({top:0, behavior:"smooth"});
}

document.getElementById("searchInput").addEventListener("input", renderGrid);

/* ---------------- Init ---------------- */
renderChips();
renderGrid();
renderQueue();
renderWaveform();
</script>

</body>
</html>
