<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audio X — Your Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#121016;
    --panel:#18151d;
    --card:#221f28;
    --text:#f5f4f7;
    --muted:#9a95a3;
    --accent1:#4e6cf0;
    --accent2:#8b5cf6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 30% 20%, #2a2438 0%, #16141c 55%, #0f0e13 100%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 16px;
  }
  .app{
    width:100%;
    max-width:1040px;
    display:flex;
    background:var(--bg);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 30px 60px rgba(0,0,0,0.5);
  }

  /* Sidebar */
  .sidebar{
    width:190px;
    background:var(--panel);
    padding:26px 18px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    flex-shrink:0;
  }
  .logo{
    color:var(--text);
    font-size:19px;
    font-weight:700;
    margin:0 0 26px 4px;
    letter-spacing:0.3px;
  }
  .nav-group{display:flex;flex-direction:column;gap:4px;}
  .nav-item{
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--muted);
    text-decoration:none;
    font-size:13.5px;
    padding:9px 10px;
    border-radius:8px;
    transition:background .15s, color .15s;
  }
  .nav-item svg{width:16px;height:16px;flex-shrink:0;}
  .nav-item:hover{color:var(--text);}
  .nav-item.active{
    background:rgba(255,255,255,0.06);
    color:var(--text);
    font-weight:600;
  }
  .nav-divider{height:16px;}
  .sidebar-bottom{display:flex;flex-direction:column;gap:4px;}

  /* Main */
  .main{
    flex:1;
    padding:26px 30px 34px;
    min-width:0;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
  }
  .topbar h1{
    color:var(--text);
    font-size:16px;
    font-weight:600;
    margin:0;
  }
  .pro-badge{
    background:linear-gradient(135deg, var(--accent1), var(--accent2));
    color:#fff;
    border:none;
    font-weight:700;
    font-size:14px;
    padding:9px 26px;
    border-radius:24px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(78,108,240,0.4);
  }

  /* Hero */
  .hero{
    position:relative;
    height:150px;
    border-radius:16px;
    overflow:hidden;
    margin-bottom:22px;
    display:flex;
    align-items:flex-end;
    padding:20px 22px;
    background:
      linear-gradient(90deg, rgba(20,14,28,0.85) 10%, rgba(60,40,90,0.35) 60%, rgba(90,60,120,0.15) 100%),
      radial-gradient(circle at 75% 30%, #6a4fb0 0%, transparent 45%),
      linear-gradient(120deg, #241b30 0%, #3a2a52 45%, #7a5aa8 100%);
  }
  .hero-text p{
    margin:0;
    color:#dcd8e6;
    font-size:12px;
    font-weight:500;
  }
  .hero-text h2{
    margin:2px 0 0;
    color:#fff;
    font-size:21px;
    font-weight:700;
  }
  .hero-play{
    position:absolute;
    right:22px;
    bottom:20px;
    width:38px;
    height:38px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--accent1), var(--accent2));
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,0.4);
  }
  .hero-play svg{width:14px;height:14px;fill:#fff;margin-left:2px;}

  /* Grid */
  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:16px;
  }
  .tile{
    position:relative;
    height:96px;
    border-radius:12px;
    overflow:hidden;
    display:flex;
    align-items:flex-end;
    padding:12px;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .tile:hover{transform:translateY(-3px);}
  .tile::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(0deg, rgba(0,0,0,0.55) 20%, rgba(0,0,0,0.05) 70%);
  }
  .tile span{
    position:relative;
    z-index:1;
    color:#fff;
    font-size:13.5px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .tile svg{width:13px;height:13px;fill:#fff;}

  .t1{background:linear-gradient(135deg,#3a3f47,#1c1e22);}
  .t2{background:linear-gradient(135deg,#b23a63,#4a1d3d);}
  .t3{background:linear-gradient(135deg,#5b6b8c,#2b3242);}
  .t4{background:linear-gradient(135deg,#3d3730,#1c1a17);}
  .t5{background:linear-gradient(135deg,#2c3b4a,#141d24);}
  .t6{background:linear-gradient(135deg,#4a8f8c,#1d3a3d);}
  .t7{background:linear-gradient(135deg,#7a4fae,#3a2a63,#c85a9e);}
  .t8{background:linear-gradient(135deg,#5a2340,#7a3050,#932d55);}
  .t9{background:linear-gradient(135deg,#8a8578,#4a463c);}
  .t10{background:linear-gradient(135deg,#6b7b8c,#2f3944);}
  .t11{background:linear-gradient(135deg,#9c7a4a,#4a3a24);}
  .t12{background:linear-gradient(135deg,#3d4048,#17181c);}

  @media (max-width:640px){
    .app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;}
    .sidebar-bottom{flex-direction:row;}
    .nav-group{flex-direction:row;flex-wrap:wrap;}
    .grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div>
      <p class="logo">Audio X</p>
      <nav class="nav-group">
        <a class="nav-item" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
          Home
        </a>
        <a class="nav-item" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          Search
        </a>
        <a class="nav-item active" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>
          My library
        </a>
      </nav>
      <div class="nav-divider"></div>
      <nav class="nav-group">
        <a class="nav-item" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 10v6M9 13h6"/></svg>
          New playlist
        </a>
        <a class="nav-item" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 8.6a5.5 5.5 0 0 0-9.3-4A5.5 5.5 0 0 0 2 8.6c0 6 9.5 11 9.5 11s9.3-5 9.3-11z"/></svg>
          Liked songs
        </a>
      </nav>
    </div>
    <div class="sidebar-bottom">
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Settings
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Log out
      </a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Your Library</h1>
      <button class="pro-badge">Pro</button>
    </div>

    <div class="hero">
      <div class="hero-text">
        <p>Your Music</p>
        <h2>On Repeat</h2>
      </div>
      <div class="hero-play">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
    </div>

    <div class="grid">
      <div class="tile t1"><span>Work Out</span></div>
      <div class="tile t2"><span>Techno 90s</span></div>
      <div class="tile t3"><span>Quiet Hours</span></div>
      <div class="tile t4"><span>Rap</span></div>

      <div class="tile t5"><span>Deep Focus</span></div>
      <div class="tile t6"><span>Beach Vibes</span></div>
      <div class="tile t7"><span>Pop Hits</span></div>
      <div class="tile t8">
        <span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
          Movie Classics
        </span>
      </div>

      <div class="tile t9"><span>Folk Music</span></div>
      <div class="tile t10"><span>Travelling</span></div>
      <div class="tile t11"><span>For Kids</span></div>
      <div class="tile t12"><span>80s Hits</span></div>
    </div>
  </main>

</div>
</body>
</html>
